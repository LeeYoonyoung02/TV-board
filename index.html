<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전보건 스트레칭 캠페인 - 순위 현황판</title>
<style>
  :root{
    --green:#7AC142; --green-dark:#2F5A1F; --ink:#1F2A1A; --ink-soft:#6B7A62;
    --panel:#EDF3E7; --gold:#E3B341; --silver:#A9AFB8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ width:100%; height:100%; overflow:hidden; background:#EAF3E3; }
  body{ font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif; }

  .board{ width:100vw; height:100vh; border:16px solid var(--green-dark); box-sizing:border-box;
    display:flex; flex-direction:column; position:relative; }

  .header{ background:#fff; padding:2vh 3vw 1.6vh; text-align:center; flex-shrink:0; position:relative; }
  .header .updated{ position:absolute; top:1.2vh; right:2.2vw; font-size:1.3vh; color:#8FA084; font-weight:600; }
  .header img{ display:block; margin:0 auto 1vh; max-height:6.4vh; width:auto; max-width:70vw; height:auto; }
  .header h1{ font-size:3.4vh; font-weight:900; color:var(--ink); }

  .body{ flex:1; padding:2.4vh 4vw; overflow:hidden; display:flex; flex-direction:column; }
  .body h2{ font-size:2.4vh; font-weight:800; color:var(--green-dark); margin-bottom:1.6vh; text-align:center; flex-shrink:0; }

  .podium{ flex:1.7; display:flex; align-items:flex-end; justify-content:center; gap:1.6vw; min-height:0; }
  .pedestal{ display:flex; flex-direction:column; align-items:center; gap:1.6vh; }
  .pedestal .medal{ width:14vh; height:14vh; flex-shrink:0; }
  .pedestal .chip{ background:#fff; border-radius:1.2vh; box-shadow:0 .4vh 1vh rgba(0,0,0,.1); white-space:nowrap; }
  .pedestal .chip span{ font-weight:900; color:var(--ink); display:block; }
  .pedestal.p1 .chip{ padding:.9vh 1.4vw; }
  .pedestal.p1 .chip span{ font-size:4vh; }
  .pedestal.p1 .step{ width:16.3vw; height:14.4vh; background:var(--green-dark); border-radius:1.6vh 1.6vh 0 0; }
  .pedestal.p2 .chip{ padding:.8vh 1.3vw; }
  .pedestal.p2 .chip span{ font-size:3.1vh; }
  .pedestal.p2 .step{ width:13.8vw; height:8.9vh; background:#3E7029; border-radius:1.6vh 1.6vh 0 0; }

  .rows{ flex:1.3; display:flex; flex-direction:column; gap:1.2vh; overflow:hidden; margin-top:1.2vh; }
  .row{ display:flex; align-items:center; gap:1.6vh; background:#fff; border-radius:1.6vh;
    padding:0 1.8vh; border:.15vh solid #E3ECDD; flex:1 1 0; min-height:0; }

  .rank{ width:4.2vh; height:4.2vh; border-radius:50%; background:var(--green); color:#fff;
    font-size:1.9vh; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rank .dash{ font-size:3.4vh; line-height:1; }

  .name{ font-size:3vh; font-weight:800; color:var(--ink); flex:1; }

  .empty-state{ text-align:center; color:var(--ink-soft); font-size:2vh; padding:4vh 0; }
</style>
</head>

<script>
/* ============================================================================
   이 버전은 Apps Script(script.google.com)를 전혀 거치지 않습니다.
   대신 구글 시트를 "웹에 게시(CSV)"한 주소를 직접 fetch로 읽어옵니다.
   아래 CSV_URL 값을 본인의 게시 링크로 바꿔서 쓰세요.

   [게시 방법]
   1. "스트레칭 인증 요약" 탭이 열려있는 상태에서
      구글시트 메뉴 → 파일 → 공유 → 웹에 게시
   2. "링크" 드롭다운에서 반드시 "스트레칭 인증 요약" 탭을 선택 (전체 문서 아님)
   3. 형식을 "쉼표로 구분된 값(.csv)"으로 선택
   4. 게시 → 뜨는 링크를 복사해서 아래 CSV_URL 자리에 붙여넣기
   ============================================================================ */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/여기에_본인_게시_ID/pub?gid=0&single=true&output=csv';

const REFRESH_MS = 15000;   // 순위 자동 새로고침 주기

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 아주 단순한 CSV 파서 — 큰따옴표로 감싼 필드(쉼표 포함 가능)도 처리합니다.
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else if (c === '\r'){ /* 무시 */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function medalSvg(color, num){
  return `<svg class="medal" viewBox="0 0 100 100">
    <path d="M38 30 L24 6 L34 6 L46 30 Z" fill="#2F5A1F"/>
    <path d="M62 30 L76 6 L66 6 L54 30 Z" fill="#2F5A1F"/>
    <circle cx="50" cy="58" r="34" fill="${color}" stroke="#2F5A1F" stroke-width="3"/>
    <circle cx="50" cy="58" r="26" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
    <text x="50" y="70" font-size="34" font-weight="900" fill="#1F2A1A" text-anchor="middle">${num}</text>
  </svg>`;
}

function renderPodium(first, second){
  const podiumEl = document.getElementById('podium');
  const goldName = first ? escapeHtml(first.dept) : '–';
  const silverName = second ? escapeHtml(second.dept) : '–';
  podiumEl.innerHTML = `
    <div class="pedestal p1">
      ${medalSvg('#E3B341', '1')}
      <div class="chip"><span>${goldName}</span></div>
      <div class="step"></div>
    </div>
    <div class="pedestal p2">
      ${medalSvg('#A9AFB8', '2')}
      <div class="chip"><span>${silverName}</span></div>
      <div class="step"></div>
    </div>`;
}

function renderList(rest){
  const rowsEl = document.getElementById('rows');
  if(!rest || rest.length === 0){ rowsEl.innerHTML = '<div class="empty-state">부서 정보가 없어요</div>'; return; }

  rowsEl.innerHTML = rest.map(function(s){
    const rankLabel = s.rank ? s.rank : '<span class="dash">–</span>';
    return `
    <div class="row">
      <div class="rank">${rankLabel}</div>
      <div class="name">${escapeHtml(s.dept)}</div>
    </div>`;
  }).join('');
}

function loadRanking(){
  const bust = CSV_URL + (CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_ts=' + Date.now();
  fetch(bust, { cache: 'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('CSV 응답 오류: ' + r.status);
      return r.text();
    })
    .then(function(text){
      const table = parseCsv(text);
      // 헤더: 순위 | 부서 | 부서 인원수(...) | 1인당 평균(회) | ...
      const deptCol = 1, avgCol = 3;
      const parsed = table.slice(1)
        .filter(function(r){ return r.length > avgCol && r[deptCol]; })
        .map(function(r){
          return { dept: r[deptCol], avg: parseFloat(r[avgCol]) || 0 };
        });

      const withAvg = parsed.filter(function(p){ return p.avg > 0; })
        .sort(function(a,b){ return b.avg - a.avg; });
      const withoutAvg = parsed.filter(function(p){ return p.avg <= 0; })
        .sort(function(a,b){ return a.dept.localeCompare(b.dept, 'ko'); });

      withAvg.forEach(function(p, i){ p.rank = i + 1; });
      withoutAvg.forEach(function(p){ p.rank = null; });

      const stats = withAvg.concat(withoutAvg);
      const first = stats.find(function(s){ return s.rank === 1; });
      const second = stats.find(function(s){ return s.rank === 2; });
      const rest = stats.filter(function(s){ return s.rank !== 1 && s.rank !== 2; });
      renderPodium(first, second);
      renderList(rest);
      document.getElementById('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleTimeString('ko-KR');
    })
    .catch(function(err){
      console.error(err);
      document.getElementById('updated').textContent = '업데이트 실패 (' + new Date().toLocaleTimeString('ko-KR') + ')';
    });
}

function init(){
  loadRanking();
  setInterval(loadRanking, REFRESH_MS);
}

init();
</script>
